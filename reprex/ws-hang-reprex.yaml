# Minimal reprex for NNG WS transport hang on Windows.
# Uses nanonext only — no Rducks dependency.
#
# Run manually via: gh workflow run ws-hang-reprex.yaml --repo sounkou-bioinfo/Rducks
# Or push to trigger: git push origin main

name: WS Hang Reprex

on:
  workflow_dispatch:
  push:
    paths:
      - "reprex/ws_hang_reprex.R"
      - "reprex/ws-hang-reprex.yaml"

jobs:
  ws-hang-reprex:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install nanonext
        run: Rscript -e "install.packages('nanonext', repos = 'https://cloud.r-project.org')"

      - name: Run WS hang reprex
        timeout-minutes: 2
        shell: Rscript {0}
        run: |
          source("reprex/ws_hang_reprex.R")
