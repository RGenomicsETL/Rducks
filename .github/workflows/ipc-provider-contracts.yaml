name: No-Arrow provider contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: read-all

jobs:
  noarrow-provider-contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    name: ${{ matrix.os }} no-Arrow contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      USE_UNSTABLE_C_API: "1"
      RDUCKS_EXTENSION_ABI_TYPE: C_STRUCT_UNSTABLE
      RDUCKS_DEV_SURFACES: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Restore script execute bits on Windows
        if: runner.os == 'Windows'
        run: chmod +x configure cleanup configure.win cleanup.win
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        run: |
          install.packages(c("DBI", "duckdb", "globals", "mirai", "mori", "nanonext", "S7", "tinytest"))
        shell: Rscript {0}

      - name: Install Rducks
        run: R CMD INSTALL --preclean .
        shell: bash

      - name: Run focused no-Arrow provider contract tests
        run: |
          tinytest::run_test_file("inst/tinytest/test_noarrow_dependency.R")
          tinytest::run_test_file("inst/tinytest/test_execution_plan_noarrow.R")
          tinytest::run_test_file("inst/tinytest/test_quack_codec_roundtrip.R")
          tinytest::run_test_file("inst/tinytest/test_direct_scalar_noarrow.R")
        shell: Rscript {0}
