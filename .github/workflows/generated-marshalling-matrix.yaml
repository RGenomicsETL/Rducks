name: Generated marshalling matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Maximum generated cases to run; 0 means all"
        required: false
        default: "0"
  schedule:
    - cron: "17 3 * * 1"

jobs:
  generated-marshalling-matrix:
    runs-on: ubuntu-latest
    env:
      USE_UNSTABLE_C_API: "1"
      RDUCKS_EXTENSION_ABI_TYPE: C_STRUCT
      RDUCKS_MATRIX_MAX: ${{ github.event.inputs.max_cases || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          install.packages(c("remotes", "DBI", "duckdb", "S7", "tinytest"))
          remotes::install_github("sounkou-bioinfo/Rtinycc@65845e0bb60384a03624eb00f439a669fcbd921e")
        shell: Rscript {0}

      - name: Install Rducks
        run: R CMD INSTALL --preclean .

      - name: Run generated marshalling matrix
        run: Rscript tools/run_generated_marshalling_matrix.R
