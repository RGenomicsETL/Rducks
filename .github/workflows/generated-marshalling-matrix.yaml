name: Generated direct/quack marshalling matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Maximum generated cases to run; 0 means all"
        required: false
        default: "0"
  schedule:
    - cron: "17 3 * * 1"

jobs:
  generated-marshalling-matrix:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: release
            runtime: supported
            name: R release generated direct/quack matrix
          - r: '4.3'
            runtime: supported
            name: R 4.3 generated direct/quack matrix
          - r: release
            runtime: latest
            name: Latest DuckDB generated direct/quack matrix
    env:
      USE_UNSTABLE_C_API: "1"
      RDUCKS_EXTENSION_ABI_TYPE: C_STRUCT_UNSTABLE
      RDUCKS_DEV_SURFACES: "true"
      RDUCKS_MATRIX_MAX: ${{ github.event.inputs.max_cases || '0' }}
      RDUCKS_CI_DUCKDB: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          install.packages(c("DBI", "mirai", "nanonext", "S7", "tinytest", "pak"))
        shell: Rscript {0}

      - name: Test DuckDB runtime policy
        run: |
          stopifnot(tinytest::all_pass(
            tinytest::run_test_file("tools/tests/test_ci_duckdb_runtime.R")
          ))
        shell: Rscript {0}

      - name: Install selected DuckDB runtime
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          source("tools/duckdb_version_support.R")
          pkg <- rducks_ci_duckdb_package(Sys.getenv("RDUCKS_CI_DUCKDB"))
          pak::pkg_install(pkg, upgrade = TRUE, ask = FALSE)
        shell: Rscript {0}

      - name: Check DuckDB engine version
        run: |
          source("tools/duckdb_version_support.R")
          con <- DBI::dbConnect(duckdb::duckdb())
          version <- DBI::dbGetQuery(con, "SELECT version() AS version")$version[[1L]]
          DBI::dbDisconnect(con, shutdown = TRUE)
          rducks_check_ci_duckdb_runtime(version, Sys.getenv("RDUCKS_CI_DUCKDB"))
        shell: Rscript {0}

      - name: Install Rducks
        run: R CMD INSTALL --preclean .

      - name: Run generated direct/quack marshalling matrix
        run: Rscript tools/run_generated_marshalling_matrix.R
