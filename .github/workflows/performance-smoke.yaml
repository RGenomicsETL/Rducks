on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

name: Performance smoke

permissions: read-all

jobs:
  vectorized-udf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      USE_UNSTABLE_C_API: "1"
      RDUCKS_EXTENSION_ABI_TYPE: C_STRUCT_UNSTABLE
      RDUCKS_DEV_SURFACES: "true"
      RDUCKS_PERF_ROWS: "262144"
      RDUCKS_PERF_DIRECT_MAX_SEC: "8"
      RDUCKS_PERF_QUACK_MAX_SEC: "8"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build current and compare with previous commit
        shell: bash
        run: |
          set -euxo pipefail

          run_perf() {
            local srcdir="$1"
            local output="$2"
            local enforce="$3"
            local libdir
            libdir="$(mktemp -d)"
            (
              cd "$srcdir"
              rm -f Rducks_*.tar.gz
              R CMD build --no-build-vignettes .
              USE_UNSTABLE_C_API="$USE_UNSTABLE_C_API" \
              RDUCKS_EXTENSION_ABI_TYPE="$RDUCKS_EXTENSION_ABI_TYPE" \
              R CMD INSTALL -l "$libdir" Rducks_*.tar.gz
            )
            R_LIBS_USER="$libdir${R_LIBS_USER:+:$R_LIBS_USER}" \
            RDUCKS_DEV_SURFACES="$RDUCKS_DEV_SURFACES" \
            RDUCKS_PERF_OUTPUT="$output" \
            RDUCKS_PERF_ENFORCE_THRESHOLDS="$enforce" \
            Rscript "$GITHUB_WORKSPACE/tools/performance_smoke.R"
            rm -rf "$libdir"
          }

          source_duckdb_versions() {
            local srcdir="$1"
            local versions_file="$srcdir/tools/ext/duckdb_capi/versions.txt"
            local legacy_metadata="$srcdir/tools/ext/duckdb_capi/duckdb_headers.json"
            if [ -f "$versions_file" ]; then
              sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$versions_file"
            elif [ -f "$legacy_metadata" ]; then
              awk -F'"' '/"duckdb_ref"/ {print $4; exit}' "$legacy_metadata"
            fi
          }

          runtime_duckdb_version="$(Rscript -e '
            ns <- asNamespace("duckdb")
            getter <- get0("get_duckdb_version", envir = ns, mode = "function", inherits = FALSE)
            version <- if (is.null(getter)) get("duckdb_version", envir = ns) else getter()
            version <- as.character(version)
            cat(if (startsWith(version, "v")) version else paste0("v", version))
          ')"
          echo "Performance runtime uses DuckDB $runtime_duckdb_version"

          # The current smoke and its absolute thresholds are authoritative even
          # when an older source tree cannot load into today's DuckDB runtime.
          run_perf "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/performance-current.csv" true

          baseline_ref="HEAD^"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            baseline_ref="${{ github.event.pull_request.base.sha }}"
            git fetch --depth=1 origin "$baseline_ref"
          fi
          if ! git rev-parse --verify "$baseline_ref^{commit}" >/dev/null 2>&1; then
            echo "No baseline commit available for performance comparison; current smoke passed."
            exit 0
          fi
          if git show "$baseline_ref:DESCRIPTION" | grep -qi 'nanoarrow'; then
            echo "Baseline still depends on nanoarrow; current smoke passed, but this change is not performance-comparable."
            exit 0
          fi

          baseline_dir="$(mktemp -d)"
          git worktree add --detach "$baseline_dir" "$baseline_ref"
          trap 'git worktree remove --force "$baseline_dir" 2>/dev/null || true; rm -rf "$baseline_dir"' EXIT

          baseline_versions="$(source_duckdb_versions "$baseline_dir")"
          if ! printf '%s\n' "$baseline_versions" | grep -Fqx "$runtime_duckdb_version"; then
            echo "Baseline $baseline_ref supports DuckDB versions: ${baseline_versions:-unknown}."
            echo "Current smoke passed; skipping an ABI-incompatible historical comparison against $runtime_duckdb_version."
            exit 0
          fi

          run_perf "$baseline_dir" "$GITHUB_WORKSPACE/performance-baseline.csv" false

          RDUCKS_PERF_COMPARE_OUTPUT="$GITHUB_WORKSPACE/performance-compare.csv" \
          Rscript tools/performance_compare.R performance-baseline.csv performance-current.csv

      - name: Upload performance smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-smoke-results
          path: |
            performance-baseline.csv
            performance-current.csv
            performance-compare.csv
          if-no-files-found: ignore
