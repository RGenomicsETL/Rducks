name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      USE_UNSTABLE_C_API: "1"
      RDUCKS_EXTENSION_ABI_TYPE: C_STRUCT
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          install.packages(c("remotes", "DBI", "duckdb", "S7", "tinytest", "nanoarrow"))
          remotes::install_github("sounkou-bioinfo/Rtinycc@032603b6881d64fc09913d203e1b5a72b8c091f9")
        shell: Rscript {0}

      - name: Build package
        run: R CMD build --no-manual --no-build-vignettes .

      - name: Check package
        run: R CMD check --no-manual --no-build-vignettes Rducks_*.tar.gz
